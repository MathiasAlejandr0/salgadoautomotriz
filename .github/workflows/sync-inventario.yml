# Dispara el sync de planilla + Drive en el hosting, sin cron de cPanel.
# Corre cada 2 horas y también a mano (Actions > Sync inventario > Run workflow).
# Secretos (Settings > Secrets and variables > Actions):
#   SYNC_CRON_SECRET  — el mismo valor que sync_cron_secret en
#                        /home/<usuario>/salgado-config.php (fuera de public_html).
# No imprime el secreto. Si falta, el job falla con una instrucción clara.
name: Sync inventario
on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
concurrency:
  group: sync-inventario
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Disparar y esperar el sync
        env:
          SYNC_CRON_SECRET: ${{ secrets.SYNC_CRON_SECRET }}
        run: |
          set -euo pipefail
          BASE="https://salgadoautomotriz.cl"
          if [ -z "${SYNC_CRON_SECRET:-}" ]; then
            echo "Falta el secreto SYNC_CRON_SECRET en el repo."
            echo "Cárgalo en Settings > Secrets and variables > Actions."
            echo "Usa el mismo valor que sync_cron_secret en salgado-config.php del servidor."
            exit 1
          fi
          post() {
            curl -sS -o /tmp/sync-post.json -w "%{http_code}" \
              --connect-timeout 20 --max-time 90 \
              -X POST \
              -H "Authorization: Bearer ${SYNC_CRON_SECRET}" \
              -H "Accept: application/json" \
              "$BASE/api/sync"
          }
          code=""
          attempt=1
          while [ "$attempt" -le 3 ]; do
            echo "Intento $attempt de POST /api/sync"
            set +e
            code=$(post)
            curl_ok=$?
            set -e
            if [ "$curl_ok" -eq 0 ]; then
              break
            fi
            echo "Error de red (curl $curl_ok), reintento en 8s"
            attempt=$((attempt + 1))
            sleep 8
          done
          if [ -z "$code" ]; then
            echo "No se pudo contactar $BASE/api/sync"
            exit 1
          fi
          echo "HTTP $code"
          python3 - <<'PY'
          import json,sys
          try:
              data=json.load(open("/tmp/sync-post.json"))
          except Exception:
              print("Respuesta no JSON")
              sys.exit(0)
          # No imprimir claves inesperadas; solo el mensaje de estado.
          for k in ("ok","accepted","mode","message","error"):
              if k in data:
                  print(f"{k}: {data[k]}")
          PY
          if [ "$code" = "503" ]; then
            echo "El servidor no tiene sync_cron_secret (o tiene menos de 16 caracteres)."
            echo "Agrega la clave en /home/<usuario>/salgado-config.php después de desplegar este PR."
            exit 1
          fi
          if [ "$code" = "401" ]; then
            echo "El secreto de GitHub no coincide con el del servidor."
            exit 1
          fi
          if [ "$code" = "404" ]; then
            echo "El endpoint aún no está en el hosting. Hay que mergear este PR a hostgator y esperar el deploy."
            exit 1
          fi
          if [ "$code" != "202" ] && [ "$code" != "409" ]; then
            echo "Respuesta inesperada"
            exit 1
          fi
          # Espera a que termine (descargas de fotos pueden tomar varios minutos).
          for i in $(seq 1 40); do
            sleep 15
            set +e
            scode=$(curl -sS -o /tmp/sync-status.json -w "%{http_code}" \
              --connect-timeout 20 --max-time 30 \
              -H "Authorization: Bearer ${SYNC_CRON_SECRET}" \
              -H "Accept: application/json" \
              "$BASE/api/sync/status")
            set -e
            if [ "$scode" != "200" ]; then
              echo "status HTTP $scode, se reintenta"
              continue
            fi
            python3 - <<'PY'
          import json,sys
          d=json.load(open("/tmp/sync-status.json"))
          run=d.get("last_run") or {}
          print("running={0} last_ok={1} finished={2} message={3} placeholders={4} published={5}".format(
              d.get("running"), run.get("ok"), run.get("finished_at"),
              run.get("message"), d.get("placeholder_count"), d.get("published")))
          if d.get("running"):
              sys.exit(2)
          if run.get("finished_at") and run.get("ok") is False:
              sys.exit(3)
          if run.get("finished_at"):
              sys.exit(0)
          sys.exit(2)
          PY
            st=$?
            if [ "$st" -eq 0 ]; then
              echo "Sync terminó bien"
              exit 0
            fi
            if [ "$st" -eq 3 ]; then
              echo "El sync terminó con error (ver last_run.message)"
              exit 1
            fi
          done
          echo "El sync sigue en curso tras la espera; revisar GET /api/sync/status"
          exit 1
